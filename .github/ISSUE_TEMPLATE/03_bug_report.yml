name: "🐛 버그 / 장애 리포트 (Bug Report)"
description: 로컬 실행, CI 또는 클라우드 연동 중 발생한 오류 제보
title: "[버그] "
labels: ["type:test"]
body:
  - type: textarea
    id: description
    attributes:
      label: 문제 설명
      description: 발생한 문제를 명확하고 간결하게 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      description: 문제를 재현하는 단계를 적어주세요.
      placeholder: |
        1. `cd apps/backend`
        2. `uvicorn app.main:app`
        3. `POST /api/v1/...` 호출 시 500 에러 발생
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 에러 로그 및 터미널 출력
      placeholder: 에러 스택 트레이스를 붙여넣어 주세요.
