name: "🔄 입출력 계약 변경 (Contract Change)"
description: 모듈 간 주고받는 schemas.py 모델 또는 DDL 변경 요청
title: "[계약변경] "
labels: ["type:contract", "status:waiting-approval"]
body:
  - type: markdown
    attributes:
      value: |
        ### ⚠️ 모듈 간 입·출력 계약 변경 요청서
        모듈 간 인터페이스(`schemas.py`)가 변경되면 연관 모듈 담당자의 필수 승인이 필요합니다.
        제목 형식: `[계약변경] <변경 모듈> -> <영향받는 모듈>`
  - type: dropdown
    id: source_module
    attributes:
      label: 발의 모듈 (출력을 변경하는 모듈)
      options:
        - "discovery"
        - "planning"
        - "provisioning"
        - "db_migration"
        - "workflows"
        - "frontend"
        - "cloudflare"
    validations:
      required: true
  - type: checkboxes
    id: affected_modules
    attributes:
      label: 영향받는 모듈 (입력을 받는 모듈 - 필수 리뷰어)
      options:
        - label: "discovery (김준석)"
        - label: "planning (이주호)"
        - label: "provisioning (박준서)"
        - label: "db_migration (안재현)"
        - label: "workflows (박재현)"
        - label: "frontend (박재현)"
        - label: "cloudflare (트래픽 전환)"
    validations:
      required: true
  - type: textarea
    id: before_after
    attributes:
      label: 변경 전/후 스펙 (Pydantic Model / DDL)
      description: 변경 전 코드와 변경 후 코드를 비교해 주세요.
      value: |
        #### 변경 전 (Before)
        ```python

        ```

        #### 변경 후 (After)
        ```python

        ```
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 변경 사유 및 마이그레이션 방안
      description: 왜 계약을 변경해야 하는지와 수신 모듈에 미치는 영향을 적어주세요.
    validations:
      required: true
