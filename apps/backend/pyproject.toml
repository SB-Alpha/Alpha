[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-backend"
version = "0.1.0"
description = "Cloud migration platform backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2",
    "boto3>=1.34",  # assessment: 원본 AWS 읽기 전용 조회
    "google-auth[urllib3]>=2",  # provisioning: 이미지 복사의 GCP 토큰 (필요할 때만 불러옴)
    "cryptography>=42",
    "keyring>=25",
]

[project.optional-dependencies]
ai = [
    "anthropic",  # assessment AI 보강 (ALPHA_AI_ENABLED=1 일 때만 사용)
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pydantic>=2",
    "cryptography>=42",
    "keyring>=25",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]