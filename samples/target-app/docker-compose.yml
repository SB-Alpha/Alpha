# Local run only. Credentials below are throwaway local values, not real secrets.
services:
  db:
    image: postgres:16
    # wal_level=logical mirrors RDS `rds.logical_replication = 1` so CDC can be tried locally.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: workitems
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d workitems"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: workitems
      PGUSER: app
      PGPASSWORD: local-only
      APP_ENV: local
    ports:
      - "127.0.0.1:8080:8080"
