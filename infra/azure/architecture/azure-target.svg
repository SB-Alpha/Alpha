<title id="title">Azure Target Architecture</title><desc id="desc">AWS source and OCI CDC connect to an Azure target in Korea Central. Korea South holds optional app infrastructure and geo-restore resources. VPN gateways are outside this Terraform module. Optional and recovery paths are dashed.</desc>
