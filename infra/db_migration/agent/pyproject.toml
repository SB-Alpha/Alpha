[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-cdc-agent"
version = "0.1.0"
description = "CDC control agent running on OCI CDC nodes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "confluent-kafka>=2.5",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["cdc_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
